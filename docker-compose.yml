version: "3.9"

services:
  bot:
    build: .
    container_name: content_generator_bot
    command: python -m bot.main
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  web:
    build: .
    container_name: content_generator_web
    command: flask --app web.app run --host=0.0.0.0 --port=5000
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
