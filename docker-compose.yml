version: "3.8"

services:
  bot:
    build: .
    container_name: content-generator-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    command: python -m bot.main

  web:
    build: .
    container_name: content-generator-web
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8005:5000"
    volumes:
      - ./data:/app/data
    command: python -m web.app
