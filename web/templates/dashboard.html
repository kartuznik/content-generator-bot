{% extends "base.html" %}
{% block content %}
<h1 class="h3 mb-4">Dashboard</h1>
<div class="row g-3">
    <div class="col-md-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="text-muted">Пользователи</div>
                <div class="display-6">{{ stats.users_count }}</div>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="text-muted">Активные подписки</div>
                <div class="display-6">{{ stats.active_subscriptions }}</div>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="text-muted">Успешные генерации</div>
                <div class="display-6">{{ stats.successful_generations }}</div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
