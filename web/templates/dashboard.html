{% extends "base.html" %}
{% block content %}
<h2>Dashboard</h2>
<div class="stats">
    <div class="card">
        <h3>Пользователи</h3>
        <p>{{ stats.users_count }}</p>
    </div>
    <div class="card">
        <h3>Активные подписки</h3>
        <p>{{ stats.active_subscriptions }}</p>
    </div>
    <div class="card">
        <h3>Всего генераций</h3>
        <p>{{ stats.total_generations }}</p>
    </div>
    <div class="card">
        <h3>Доход (RUB)</h3>
        <p>{{ "%.2f"|format(stats.total_revenue) }}</p>
    </div>
</div>
{% endblock %}
