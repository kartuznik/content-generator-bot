<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Content Generator Admin</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; color: #111; }
        header { background: #1f2937; color: #fff; padding: 14px 20px; }
        nav a { color: #fff; text-decoration: none; margin-right: 16px; }
        main { padding: 20px; }
        .card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        table { width: 100%; border-collapse: collapse; background: #fff; }
        th, td { border: 1px solid #e5e7eb; padding: 8px; text-align: left; }
        th { background: #f3f4f6; }
        input, button { padding: 6px 8px; margin: 2px 0; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
    </style>
</head>
<body>
<header>
    <strong>Content Generator Admin</strong>
    <nav style="margin-top:8px;">
        <a href="/">Dashboard</a>
        <a href="/users/">Users</a>
    </nav>
</header>
<main>
    {% block content %}{% endblock %}
</main>
</body>
</html>
